# Render blueprint for the SayTrade API.
#
# Free plan facts that shaped this file:
#   - A free web service spins down after 15 minutes without a request and wakes
#     on the next one (about a minute, roughly 50 s of it is boot).
#   - Render's FREE Postgres expires after 30 days and is then deleted. So the
#     database is NOT declared here: use Neon's free Postgres (no expiry, scales
#     to zero after 5 minutes of idle) and paste its connection string into
#     DATABASE_URL.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and then asks for every value marked `sync: false`.
services:
  - type: web
    name: saytrade-api
    runtime: python
    plan: free
    region: frankfurt # closest Render region to Egypt; keep Neon in eu-central-1 too
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # uv is first-class on Render's Python runtime, so the lock file is the only
    # dependency source — no requirements.txt to drift out of date.
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Migrations run at boot, before the server accepts traffic: a failed
    # migration stops the deploy instead of serving a stale schema.
    startCommand: .venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Everything below is entered once in the Render dashboard. `sync: false`
      # keeps the value out of this file and out of git.
      - key: DATABASE_URL
        sync: false # Neon connection string, postgresql+asyncpg:// and ?ssl=require
      - key: CLERK_FRONTEND_API
        sync: false # https://<instance>.clerk.accounts.dev — also the JWT issuer
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Comma-separated browser origins allowed to call the API. Set it to the
      # Vercel URL after the frontend deploy, then Render redeploys.
      - key: CORS_ORIGINS
        sync: false
    # Plan limits and model names keep their defaults from app/config.py, so they
    # are deliberately absent here: one source of truth for product rules.
