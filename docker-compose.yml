services:
  db:
    image: postgres:18-alpine
    container_name: saytrade-db
    restart: unless-stopped
    environment:
      # Read from .env (compose loads it automatically from this directory).
      POSTGRES_USER: ${POSTGRES_USER:-saytrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saytrade}
      POSTGRES_DB: ${POSTGRES_DB:-saytrade}
    ports:
      # Bound to localhost only: the DB is not reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ keeps PGDATA in /var/lib/postgresql/18/docker and declares
      # /var/lib/postgresql as the image VOLUME. Mounting the old
      # /var/lib/postgresql/data path instead would create an anonymous volume
      # and lose all data when the container is recreated.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ is an escaped $, so the container's shell expands these itself.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
